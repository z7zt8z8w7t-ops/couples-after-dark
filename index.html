const audio={};
function makeAudio(src){const a=new Audio(src);a.preload='auto';a.playsInline=true;a.setAttribute('playsinline','');return a}
function initAudio(){
  if(audio.tickPool)return;
  audio.tickPool=Array.from({length:8},()=>makeAudio(SOUND.tick));
  audio.reveal=makeAudio(SOUND.reveal);audio.wild=makeAudio(SOUND.wild);
  audio.point=makeAudio(SOUND.point);audio.soft=makeAudio(SOUND.soft);
  audio.confirm=makeAudio(SOUND.confirm);audio.silent=makeAudio(SOUND.silent);
  audio.tickIndex=0;
}
async function playClip(a,vol=1){
  if(!soundOn||!a)return false;
  try{a.pause();a.currentTime=0;a.volume=vol;await a.play();return true}catch(e){return false}
}
async function unlockAudio(){
  initAudio();
  if(audioUnlocked)return true;
  try{
    audio.silent.currentTime=0;
    await audio.silent.play();
    audio.silent.pause();
    audio.silent.currentTime=0;
    audioUnlocked=true;
    return true;
  }catch(e){return false}
}
function tickSound(){
  if(!soundOn||!audioUnlocked)return;
  const a=audio.tickPool[audio.tickIndex++%audio.tickPool.length];
  try{a.pause();a.currentTime=0;a.volume=.75;a.play().catch(()=>{})}catch(e){}
}
function revealSound(wild=false){if(soundOn&&audioUnlocked)playClip(wild?audio.wild:audio.reveal,.9)}
function pointSound(){if(soundOn&&audioUnlocked)playClip(audio.point,.8)}
function softSound(){if(soundOn&&audioUnlocked)playClip(audio.soft,.65)}
function haptic(pattern=20){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
async function toggleSound(e){
  if(e)e.stopPropagation();
  initAudio();
  if(soundOn&&audioUnlocked){soundOn=false;soundBtn.textContent='🔇';return}
  soundOn=true;soundBtn.textContent='🔊';
  const ok=await unlockAudio();
  if(ok){
    const heard=await playClip(audio.confirm,1);
    if(!heard){soundOn=false;soundBtn.textContent='🔇';alert('Your iPhone blocked the sound. Make sure media volume is up, then tap 🔇 once to enable sound.')} 
  }else{
    soundOn=false;soundBtn.textContent='🔇';
    alert('Your iPhone blocked the sound. Make sure media volume is up, then tap 🔇 once to enable sound.');
  }
}

function choose(){let l=currentLevel(),arr=poolFor(l);if(!used[l])used[l]=[];let avail=arr.map((_,i)=>i).filter(i=>!used[l].includes(i));if(!avail.length){used[l]=[];avail=arr.map((_,i)=>i)}let i=avail[Math.floor(Math.random()*avail.length)];used[l].push(i);let offset={fun:0,flirty:20,daring:40,after:60,filthy:80}[l];let number=(l==='filthy'?i+1:offset+i+1);return {...arr[i],number,l}}
async function spin(e){if(e)e.stopPropagation();if(busy)return;await unlockAudio();busy=true;question.classList.add("hidden");qno.classList.add("hidden");typeBadge.classList.add("hidden");forfeitText.classList.add("hidden");hint.textContent="Spinning…";turn.textContent=names[player]+"'s turn";wheel.classList.add('pulse');let total=24,i=0;function step(){rotation+=32+Math.random()*35;wheel.style.transform=`rotate(${rotation}deg)`;num.textContent=(currentLevel()==='filthy'?1+Math.floor(Math.random()*50):1+Math.floor(Math.random()*130));tickSound(i,total);if(i%4===0)haptic(8);i++;if(i<total){let delay=45+Math.pow(i/total,2)*210;setTimeout(step,delay)}else{wheel.classList.remove('pulse');wheel.style.transform=`rotate(${Math.round(rotation/360)*360}deg)`;let x=choose();num.textContent=x.number;qno.textContent="#"+x.number;typeBadge.textContent=x.type==='DARE'?'🔥 DARE':'💬 QUESTION';typeBadge.classList.remove('hidden');question.textContent=x.text;qno.classList.remove("hidden");question.classList.remove("hidden");hint.textContent="Tap again for the next spin";let wild=x.text.includes('Wildcard')||x.text.includes('🔥 Confession');revealSound(wild);haptic(wild?[40,60,80]:35);round++;player=1-player;updateBadge();busy=false}}step()}
