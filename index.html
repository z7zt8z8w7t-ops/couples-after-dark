AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
const CLIP={"silent":[0.0,0.04],"confirm":[0.11,0.215],"tick":[0.3949,0.028],"reveal":[0.4929,0.27],"wild":[0.8328,0.43],"point":[1.3328,0.16],"soft":[1.5628,0.06]};
let audioPlayer=null,audioUnlocked=false,audioStopTimer=null;

function initAudio(){
  if(audioPlayer)return;
  audioPlayer=new Audio(AUDIO_SPRITE);
  audioPlayer.preload='auto';
  audioPlayer.playsInline=true;
  audioPlayer.setAttribute('playsinline','');
}

async function unlockAudio(){
  initAudio();
  if(audioUnlocked)return true;
  try{
    audioPlayer.volume=0.01;
    audioPlayer.currentTime=CLIP.silent[0];
    await audioPlayer.play();
    audioPlayer.pause();
    audioPlayer.currentTime=0;
    audioPlayer.volume=1;
    audioUnlocked=true;
    return true;
  }catch(e){
    return false;
  }
}

function playClip(name,vol=1){
  if(!soundOn||!audioUnlocked||!audioPlayer)return false;
  const clip=CLIP[name];
  if(!clip)return false;
  try{
    if(audioStopTimer)clearTimeout(audioStopTimer);
    audioPlayer.pause();
    audioPlayer.currentTime=clip[0];
    audioPlayer.volume=vol;
    const p=audioPlayer.play();
    if(p&&p.catch)p.catch(()=>{});
    audioStopTimer=setTimeout(()=>{
      try{audioPlayer.pause()}catch(e){}
    },Math.max(20,clip[1]*1000));
    return true;
  }catch(e){
    return false;
  }
}

function tickSound(){playClip('tick',.8)}
function revealSound(wild=false){playClip(wild?'wild':'reveal',.95)}
function pointSound(){playClip('point',.85)}
function softSound(){playClip('soft',.7)}

async function toggleSound(e){
 if(e)e.stopPropagation(); initAudio();
 if(!audioUnlocked){
   soundOn=true; soundBtn.textContent='🔊';
   const ok=await unlockAudio();
   if(!ok){soundOn=false;soundBtn.textContent='🔇';return;}
   playClip('confirm',1); return;
 }
 soundOn=!soundOn; soundBtn.textContent=soundOn?'🔊':'🔇';
 if(soundOn)playClip('confirm',1);
}
function haptic(pattern=20){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
async function startGame(){if(soundOn)await unlockAudio();names=[p1.value.trim()||"Player 1",p2.value.trim()||"Player 2"];n1.textContent=bp1.textContent=names[0];n2.textContent=bp2.textContent=names[1];level.value=startLevel.value;setup.classList.add("hidden");game.classList.remove("hidden");updateBadge();turn.textContent=names[0]+"'s turn — tap to spin";softSound();window.scrollTo(0,0)}
function currentLevel(){let l=level.value;if(l!=="surprise")return l;let stages=["fun","flirty","daring","after","filthy"];return stages[Math.min(4,Math.floor(round/4))]}
function updateBadge(){badge.textContent=level.value==="surprise"?"🎲 Surprise → "+label(currentLevel()):label(level.value)}
function levelChanged(){used={};updateBadge();typeBadge.classList.add('hidden');softSound()}
function poolFor(l){let p=Q[l].map((text,i)=>({text,type:'QUESTION',local:i}));if(l==='filthy')p=p.concat(D.filthy.map((text,i)=>({text,type:'DARE',local:Q.filthy.length+i})));return p}
function choose(){let l=currentLevel(),arr=poolFor(l);if(!used[l])used[l]=[];let avail=arr.map((_,i)=>i).filter(i=>!used[l].includes(i));if(!avail.length){used[l]=[];avail=arr.map((_,i)=>i)}let i=avail[Math.floor(Math.random()*avail.length)];used[l].push(i);let offset={fun:0,flirty:20,daring:40,after:60,filthy:80}[l];let number=(level.value==='surprise'?offset+i+1:i+1);return {...arr[i],number,l}}
async function spin(e){if(e)e.stopPropagation();if(busy)return;if(soundOn)await unlockAudio();busy=true;question.classList.add("hidden");qno.classList.add("hidden");typeBadge.classList.add("hidden");forfeitText.classList.add("hidden");hint.textContent="Spinning…";turn.textContent=names[player]+"'s turn";wheel.classList.add('pulse');let total=24,i=0;function step(){rotation+=32+Math.random()*35;wheel.style.transform=`rotate(${rotation}deg)`;{
 const active=currentLevel();
 const max=(level.value==='surprise'?130:(active==='filthy'?50:20));
 num.textContent=1+Math.floor(Math.random()*max);
}tickSound(i,total);if(i%4===0)haptic(8);i++;if(i<total){let delay=45+Math.pow(i/total,2)*210;setTimeout(step,delay)}else{wheel.classList.remove('pulse');wheel.style.transform=`rotate(${Math.round(rotation/360)*360}deg)`;let x=choose();num.textContent=x.number;qno.textContent="#"+x.number;typeBadge.textContent=x.type==='DARE'?'🔥 DARE':'💬 QUESTION';typeBadge.classList.remove('hidden');question.textContent=x.text;qno.classList.remove("hidden");question.classList.remove("hidden");hint.textContent="Tap again for the next spin";let wild=x.text.includes('Wildcard')||x.text.includes('🔥 Confession');revealSound(wild);haptic(wild?[40,60,80]:35);round++;player=1-player;updateBadge();busy=false}}step()}
function addScore(i,e){e.stopPropagation();score[i]++;document.getElementById("s"+(i+1)).textContent=score[i];pointSound();haptic(20)}
function skip(e){e.stopPropagation();softSound();if(!busy)spin(e)}
function forfeit(e){e.stopPropagation();forfeitText.textContent=forfeits[Math.floor(Math.random()*forfeits.length)];forfeitText.classList.remove("hidden");softSound();haptic(15)}
function newGame(e){e.stopPropagation();if(confirm("Start a new game?")){score=[0,0];player=0;round=0;used={};s1.textContent=s2.textContent="0";game.classList.add("hidden");setup.classList.remove("hidden");window.scrollTo(0,0)}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
