<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0711">
<title>Couples After Dark</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0711;color:#fff}
body{background:radial-gradient(circle at 10% 0,#251643 0,transparent 38%),radial-gradient(circle at 100% 15%,#3a1729 0,transparent 38%),#0b0711}
.wrap{max-width:700px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.pill,.levelBadge{border:1px solid #ffffff22;background:#ffffff0b;border-radius:999px;padding:10px 15px}
.hero{text-align:center;padding:28px 0 20px}.kiss{font-size:52px}.hero h1{font-size:48px;line-height:.98;margin:12px 0}.muted{color:#b9adb9}
.card{background:#ffffff09;border:1px solid #ffffff18;border-radius:28px;padding:22px;margin:14px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#c6bac8;margin-bottom:8px}
input,select{width:100%;background:#09070d;color:#fff;border:1px solid #ffffff18;border-radius:18px;padding:17px;font-size:19px}
button{width:100%;border:0;border-radius:19px;padding:18px;font-size:19px;font-weight:800;color:#fff;background:#ffffff12}
.primary{background:linear-gradient(90deg,#ea4f91,#8754ef);font-size:21px}.hidden{display:none!important}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}.scorebox{text-align:center;padding:16px;border:1px solid #ffffff16;border-radius:25px;background:#ffffff08}.scorebox b{font-size:34px}.vs{font-weight:900;color:#887b8d}
.play{min-height:510px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;touch-action:manipulation}
.turn{font-size:21px;font-weight:800;color:#ffd26a;margin:10px}.instruction{font-size:17px;color:#b9adb9;margin-top:15px}
.wheel{width:230px;height:230px;border-radius:50%;position:relative;margin:25px;background:conic-gradient(#ee4f91 0 45deg,#7d52ee 45deg 90deg,#ffb54c 90deg 135deg,#ee4f91 135deg 180deg,#7d52ee 180deg 225deg,#ffb54c 225deg 270deg,#ee4f91 270deg 315deg,#7d52ee 315deg);box-shadow:0 0 50px #a04cff55;border:8px solid #ffffff18;display:flex;align-items:center;justify-content:center}
.wheel:before{content:"";position:absolute;top:-27px;border-left:17px solid transparent;border-right:17px solid transparent;border-top:32px solid #fff;z-index:3}
.wheelInner{width:135px;height:135px;border-radius:50%;background:#0c0811;border:5px solid #ffffff26;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;box-shadow:inset 0 0 25px #000}
.spinning{animation:spin .22s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.pulse{animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.08);filter:brightness(1.3)}}
.questionNo{font-size:28px;color:#ffd26a;font-weight:900}.question{font-size:31px;line-height:1.08;font-weight:900;max-width:590px;margin:10px auto}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:17px;padding:15px}.danger{background:#8c2743}.secondary{background:#2b2334}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:12px}.forfeit{border:1px dashed #ffffff28;background:#ffffff07}
select option{background:#111}
@media(max-width:430px){.hero h1{font-size:42px}.question{font-size:27px}.wheel{width:205px;height:205px}.play{min-height:480px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">🔥 Couples After Dark</div><div class="pill">Date Night</div></header>

<section id="setup">
 <div class="hero"><div class="kiss">💋</div><h1>Couples<br>After Dark</h1><p class="muted">Tap. Spin. Reveal. Answer. Repeat.</p></div>
 <div class="card">
  <div class="row">
   <div><label>Player 1</label><input id="p1" value="Jim"></div>
   <div><label>Player 2</label><input id="p2" value="Emma"></div>
  </div>
  <div style="margin-top:18px"><label>Starting level</label><select id="startLevel">
   <option value="fun">😄 Fun</option><option value="flirty" selected>😘 Flirty</option><option value="daring">🔥 Daring</option><option value="after">🌙 After Dark</option><option value="explicit">🔞 Explicit</option><option value="surprise">🎲 Surprise Me</option>
  </select></div>
  <button class="primary" style="margin-top:18px" onclick="startGame()">Start Date Night</button>
  <p class="muted" style="text-align:center">Everything is optional. Skip anything either of you doesn't fancy.</p>
 </div>
</section>

<section id="game" class="hidden">
 <div class="score"><div class="scorebox"><span id="n1"></span><br><b id="s1">0</b></div><div class="vs">VS</div><div class="scorebox"><span id="n2"></span><br><b id="s2">0</b></div></div>
 <div class="card" style="padding:12px 16px"><label>Intensity</label><select id="level" onchange="levelChanged()">
  <option value="fun">😄 Fun</option><option value="flirty">😘 Flirty</option><option value="daring">🔥 Daring</option><option value="after">🌙 After Dark</option><option value="explicit">🔞 Explicit</option><option value="surprise">🎲 Surprise Me</option>
 </select></div>
 <div id="play" class="card play" onclick="spin(event)">
   <div class="levelBadge" id="badge">😘 Flirty</div>
   <div class="turn" id="turn">Tap the wheel to spin</div>
   <div id="wheel" class="wheel"><div id="num" class="wheelInner">?</div></div>
   <div id="qno" class="questionNo hidden"></div><div id="question" class="question hidden"></div>
   <div id="hint" class="instruction">Tap anywhere in this card</div>
 </div>
 <div class="controls"><button onclick="addScore(0,event)">+1 <span id="bp1"></span></button><button onclick="addScore(1,event)">+1 <span id="bp2"></span></button></div>
 <button class="forfeit" style="margin-top:12px" onclick="forfeit(event)">🎭 Random Forfeit</button>
 <div id="forfeitText" class="card hidden" style="text-align:center;font-size:20px"></div>
 <div class="toolbar" style="margin-top:12px"><button class="secondary small" onclick="skip(event)">⏭ Skip / Spin Again</button><button class="danger small" onclick="newGame(event)">↩ New Game</button></div>
</section>
</div>
<script>
const Q={
fun:[
"What's the funniest memory we have together?","What tiny thing I do always makes you smile?","If we disappeared for a weekend tomorrow, where would we go?","What was your first impression of me?","What's one thing we're surprisingly good at as a couple?","Which of us would survive longest on a desert island?","What's one date you'd love us to repeat?","What's a ridiculous habit of mine you secretly like?","What song reminds you of us?","What's something new you'd like us to learn together?","What's your favourite ordinary moment we share?","If our relationship were a film, what genre would it be?","What three words describe us best?","Who is more competitive?","What's something I do better than I realise?","What would our perfect lazy Sunday look like?","What's the best spontaneous thing we've done?","What makes you feel most appreciated by me?","What should we do more often just for fun?","What's one place you'd love to travel with me?"
],
flirty:[
"What makes flirting between us work so well?","What outfit of mine do you find most attractive?","What's the first physical thing you noticed about me?","When do you find me hardest to resist?","What's your favourite way for me to kiss you?","What's something I do that instantly gets your attention?","Where's your favourite place for us to kiss?","What's the most attractive thing about my confidence?","What's one compliment from me you never get tired of?","What's the sexiest date we've had?","What kind of flirting from me works every time?","What's something innocent I do that you find unexpectedly sexy?","Would you rather have a long kiss or a long massage?","What's your favourite memory of us being unable to keep our hands off each other?","What's something you'd like me to whisper in your ear?","What makes the anticipation between us exciting?","What's your favourite way for me to initiate affection?","What would make tonight feel especially romantic?","Which of my looks gives away exactly what I'm thinking?","What do I do that makes you feel most desired?"
],
daring:[
"What's something adventurous you'd like us to try together?","Would you rather take charge or let me take charge tonight?","What's a fantasy setting you think would be exciting?","What's something you've wanted to ask me for but haven't?","What kind of teasing do you enjoy most?","What's the boldest place you'd consider sharing a passionate kiss?","What's one thing that instantly builds anticipation for you?","Would you prefer a surprise date or a surprise challenge?","What's a boundary you'd like us to talk about more openly?","What's something new you'd feel comfortable experimenting with together?","What makes you feel confident enough to be adventurous with me?","What's the most daring thing we've done as a couple?","What would your ideal slow-build evening look like?","What's something you'd like me to initiate more often?","Would you rather know what's coming or be surprised?","What kind of atmosphere makes you feel most adventurous?","What's something you find exciting that might surprise me?","What's one way we could make date night less predictable?","What does 'taking charge' mean to you?","What's something we haven't tried that you're curious about?"
],
after:[
"What's a private fantasy you'd be comfortable telling me about?","What makes you feel most wanted by me?","Is there something you've imagined us trying but never mentioned?","What kind of anticipation turns you on most?","What's your favourite way for me to take the lead?","What's one thing you'd like more of when we're intimate?","What's something I do that changes your mood instantly?","Would you rather tonight be slow and teasing or spontaneous and intense?","What's a scenario you'd enjoy role-playing together?","What's something you would enjoy being surprised with, provided we agreed the boundaries first?","What makes you feel safest being completely open with me?","What's one intimate compliment you'd love to hear more often?","What sort of touch makes you feel closest to me?","What's something you'd like us to spend more time exploring together?","What's the best way for me to tell when you want me to take the lead?","What's something that makes an intimate moment memorable for you?","Would you rather plan an adventurous night together or let one person plan it?","What's one desire you think we could talk about more openly?","What's your favourite part of the build-up to intimacy?","What's one thing you want me to know about what makes you feel desired?"
,
explicit:["What is the filthiest thought you have had about me that you have never admitted?", "What is something you have desperately wanted to ask me for but felt too embarrassed to say?", "What fantasy involving the two of us would surprise me most?", "What is the naughtiest place you have imagined the two of us together?", "If embarrassment disappeared tonight, what would you finally admit you wanted?", "What is one desire you have deliberately kept secret from me?", "What is the most provocative message you would love to receive from me?", "What is something about me that instantly sends your mind somewhere naughty?", "What is one fantasy you have replayed in your head more than once?", "What is the boldest invitation you would love me to make tonight?", "What is one thing you secretly hope I suggest tonight?", "What is one private thought about me you have never said out loud?", "What is the most inappropriate moment you have caught yourself thinking about me?", "What is one thing you want me to be much more shameless about with you?", "What is one confession that would make you blush even saying it to me?", "What is one thing you wish you were brave enough to ask me for tonight?", "What is one desire you think I would never guess correctly?", "What is the most mischievous thought you have had about us while other people were around?", "What is one thing you would love me to whisper to you when nobody else could hear?", "What is one fantasy you would only admit when we were completely alone?", "What is one thing you would love me to take control of on a private date night?", "What is something you would love to take control of yourself?", "What is one thing you would love us to become more adventurous about?", "What is the boldest thing you would let me choose for you on a date night?", "What is one private fantasy you would enjoy talking through even if we never acted on it?", "What is one thing you would love me to initiate with much more confidence?", "What is one thing you think about when you really miss me?", "What is one desire you want us to be able to talk about without any embarrassment?", "What is one thing you would love to hear me confess about how much I want you?", "What is the naughtiest compliment you could give me without describing an act?", "What is one thing you want more of when we have complete privacy?", "What is one fantasy setting that instantly makes your imagination run wild?", "What is something you secretly want me to dare you to admit?", "What is one thing you would love us to try once purely because it sounds exciting?", "What is the boldest thing you would want to say to me with the lights off?", "What is one thing about taking charge or giving up control that appeals to you?", "What is one boundary or preference you would like us to talk about more openly before getting adventurous?", "What is one thing you would love me to notice more about what turns you on?", "What is one naughty question you have been hoping this game would make me answer?", "What is the filthiest non-graphic confession you are willing to make to me right now?"]
]};
const forfeits=["Give your partner a 30-second shoulder massage.","Give your partner your best deliberately cheesy chat-up line.","Hold eye contact for 20 seconds without laughing.","Let your partner choose your next question level.","Give your partner three genuine compliments.","Dance together for one minute with no music.","Give your partner a kiss somewhere they choose, within agreed boundaries.","Whisper something you love about your partner.","Recreate your first-date flirting for 30 seconds.","Your partner chooses: cuddle, kiss, or massage for one minute."];
let names=["Player 1","Player 2"],score=[0,0],player=0,used={},busy=false,round=0;
function label(l){return {fun:"😄 Fun",flirty:"😘 Flirty",daring:"🔥 Daring",after:"🌙 After Dark",explicit:"🔞 Explicit",surprise:"🎲 Surprise Me"}[l]}
function startGame(){names=[p1.value.trim()||"Player 1",p2.value.trim()||"Player 2"];n1.textContent=bp1.textContent=names[0];n2.textContent=bp2.textContent=names[1];level.value=startLevel.value;setup.classList.add("hidden");game.classList.remove("hidden");updateBadge();turn.textContent=names[0]+"'s turn — tap to spin";window.scrollTo(0,0)}
function currentLevel(){let l=level.value;if(l!=="surprise")return l;let stages=["fun","flirty","daring","after","explicit"];return stages[Math.min(4,Math.floor(round/4))]}
function updateBadge(){badge.textContent=level.value==="surprise"?"🎲 Surprise → "+label(currentLevel()):label(level.value)}
function levelChanged(){used={};updateBadge()}
function choose(){let l=currentLevel(),arr=Q[l];if(!used[l])used[l]=[];let avail=arr.map((_,i)=>i).filter(i=>!used[l].includes(i));if(!avail.length){used[l]=[];avail=arr.map((_,i)=>i)}let i=avail[Math.floor(Math.random()*avail.length)];used[l].push(i);let offset={fun:0,flirty:20,daring:40,after:60,explicit:80}[l];return {text:arr[i],number:offset+i+1,l}}
function spin(e){if(e)e.stopPropagation();if(busy)return;busy=true;question.classList.add("hidden");qno.classList.add("hidden");forfeitText.classList.add("hidden");hint.textContent="Spinning…";turn.textContent=names[player]+"'s turn";wheel.classList.add("spinning","pulse");let ticks=0;let iv=setInterval(()=>{num.textContent=1+Math.floor(Math.random()*120);ticks++;if(ticks>18){clearInterval(iv);wheel.classList.remove("spinning","pulse");let x=choose();num.textContent=x.number;qno.textContent="#"+x.number;question.textContent=x.text;qno.classList.remove("hidden");question.classList.remove("hidden");hint.textContent="Tap again for the next spin";round++;player=1-player;updateBadge();busy=false}},75)}
function addScore(i,e){e.stopPropagation();score[i]++;document.getElementById("s"+(i+1)).textContent=score[i]}
function skip(e){e.stopPropagation();if(!busy)spin(e)}
function forfeit(e){e.stopPropagation();forfeitText.textContent=forfeits[Math.floor(Math.random()*forfeits.length)];forfeitText.classList.remove("hidden")}
function newGame(e){e.stopPropagation();if(confirm("Start a new game?")){score=[0,0];player=0;round=0;used={};s1.textContent=s2.textContent="0";game.classList.add("hidden");setup.classList.remove("hidden");window.scrollTo(0,0)}}
</script>
</body></html>
